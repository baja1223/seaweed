# MediaMTX for the Compose network. HTTP (WHIP, WHEP, HLS, API) stays inside
# Docker and is reached through the page on port 4173. UDP 8189 is published on
# the host so a browser on this machine can send and receive WebRTC media.
authMethod: http
authHTTPAddress: http://streams:4002/api/media/authorize
authHTTPExclude:
  - action: api
api: yes
rtsp: no
srt: no
moq: no
rtmp: yes
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
webrtcSTUNGatherTimeout: 2s
webrtcAllowOrigins: ["*"]
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
paths:
  "~^[a-f0-9-]{36}$":
    overridePublisher: no
