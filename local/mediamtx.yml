authMethod: http
authHTTPAddress: http://host.docker.internal:4002/api/media/authorize
authHTTPExclude:
  - action: api
api: yes
rtsp: no
srt: no
webrtc: yes
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]
webrtcAllowOrigins: [http://127.0.0.1:4173]
moq: no
rtmp: yes
hls: yes
hlsVariant: fmp4
hlsAllowOrigins:
  - http://127.0.0.1:4173
  - http://localhost:4173
paths:
  "~^[a-f0-9-]{36}$":
    overridePublisher: no
