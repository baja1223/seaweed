apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: seaweed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/seaweed:latest
          command: ["node", "local/site.js"]
          env:
            - name: FRONTEND_PORT
              value: "4173"
            - name: WEB_BIND
              value: "0.0.0.0"
            - name: WEB_HOSTS
              value: "*"
            - name: AUTH_HOST
              value: auth.seaweed.svc.cluster.local
            - name: STREAMS_HOST
              value: streams.seaweed.svc.cluster.local
            - name: CONTENT_HOST
              value: content.seaweed.svc.cluster.local
          ports:
            - containerPort: 4173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: seaweed
spec:
  selector:
    app: frontend
  ports:
    - port: 4173
      targetPort: 4173
      nodePort: 30080
  type: NodePort

