services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: buttblastr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres_password}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./streams_schema.sql:/docker-entrypoint-initdb.d/01-streams.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buttblastr"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  auth:
    # One image for every Node service. Only this service builds it, so Compose
    # does not try to tag seaweed:local from several builds at the same time.
    build: .
    image: seaweed:local
    init: true
    restart: unless-stopped
    command: ["node", "auth_server.js"]
    environment:
      NODE_ENV: development
      LOCAL_BIND: 0.0.0.0
      AUTH_PORT: 4000
      MONGO_URI: mongodb://mongo:27017/buttblastr_auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:4173,http://localhost:4173}
      OPERATOR_USER_ID: ${OPERATOR_USER_ID:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  chat:
    image: seaweed:local
    init: true
    restart: unless-stopped
    command: ["node", "chat_server.js"]
    environment:
      NODE_ENV: development
      LOCAL_BIND: 0.0.0.0
      CHAT_PORT: 4001
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:4173,http://localhost:4173}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  streams:
    image: seaweed:local
    init: true
    restart: unless-stopped
    command: ["node", "streams_server.js"]
    environment:
      NODE_ENV: development
      LOCAL_BIND: 0.0.0.0
      STREAMS_PORT: 4002
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: buttblastr
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-postgres_password}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:4173,http://localhost:4173}
      OPERATOR_USER_ID: ${OPERATOR_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  content:
    image: seaweed:local
    init: true
    restart: unless-stopped
    command: ["node", "content_server.js"]
    environment:
      NODE_ENV: development
      LOCAL_BIND: 0.0.0.0
      CONTENT_PORT: 4003
      MONGO_URI: mongodb://mongo:27017/buttblastr_content
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:4173,http://localhost:4173}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:4003:4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    image: seaweed:local
    init: true
    restart: unless-stopped
    command: ["node", "local/site.js"]
    environment:
      NODE_ENV: development
      FRONTEND_PORT: 4173
      WEB_BIND: 0.0.0.0
      WEB_HOSTS: 127.0.0.1,localhost,::1
      AUTH_HOST: auth
      AUTH_PORT: 4000
      STREAMS_HOST: streams
      STREAMS_PORT: 4002
      CONTENT_HOST: content
      CONTENT_PORT: 4003
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      streams:
        condition: service_healthy
      content:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo-data: {}
  pg-data: {}
